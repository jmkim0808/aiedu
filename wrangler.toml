# Cloudflare Workers 배포 설정
#
# 최초 설정 순서는 SETUP.md 를 따른다.
#
# 원칙 (powernet-esg 와 동일하게 맞춘다)
#   - 의존성은 wrangler 하나뿐이다.
#   - 빌드 단계를 만들지 않는다. 사내 전산팀이 없으므로 유지보수 난이도를 최소화한다.

name = "aiedu"
main = "src/api.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# D1 (SQLite). 아직 도메인 테이블이 없다. 설계문서를 반영하면서 db/migrations 에 추가한다.
# database_id 는 `wrangler d1 create aiedu` 출력값으로 채운다.
[[d1_databases]]
binding = "DB"
database_name = "aiedu"
database_id = "[확인 필요 — wrangler d1 create 출력값을 붙여넣는다]"

# 파일 업로드가 필요해지면 주석을 푼다. 당장 쓰지 않으면 버킷을 만들지 않는다.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "aiedu-files"

[vars]
APP_NAME = "AIEDU"

# Cloudflare Access 통과를 강제한다. 최초 배포 확인 시에만 임시로 "false" 로 두고,
# Access Application 설정 직후 반드시 "true" 로 되돌린다. (SETUP.md 4단계)
REQUIRE_ACCESS = "true"
